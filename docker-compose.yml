name: mcp-stepup-lab

services:
  # ---------------------------------------------------------------- IdP / AS
  # node-oidc-provider with Rich Authorization Requests (RFC 9396) + the authorization details
  # types metadata endpoint (draft-ietf-oauth-rar-metadata-remediation).
  idp:
    build: ./idp
    environment:
      # Browser-facing issuer. Containers reach the same server as http://idp:8080; the AS pins
      # every URL it emits to the issuer, and clients rewrite back-channel calls.
      ISSUER: http://localhost:8080
      MCP_RESOURCE: http://mcp-server:3000/mcp
      BASE_SCOPE: mcp:basic
      BASE_TOKEN_TTL: "600"
      ONE_SHOT_TOKEN_TTL: "120"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- Resource server
  mcp-server:
    build: ./mcp-server
    environment:
      MCP_RESOURCE: http://mcp-server:3000/mcp
      OIDC_ISSUER: http://localhost:8080
      OIDC_JWKS_URI: http://idp:8080/jwks
      BASE_SCOPE: mcp:basic
      PAYMENT_DETAILS_TYPE: money_transfer
      # "http": 401 insufficient_authorization (RAR remediation draft) | "inband": JSON-RPC error -32043
      CHALLENGE_BINDING: ${CHALLENGE_BINDING:-http}
      ELICITATION_TIMEOUT_MS: "120000"
      DEMO_UNSAFE_TOOL: "true"
      RISK_AMOUNT_THRESHOLD: "500"
    ports:
      - "3000:3000"
    depends_on:
      idp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Agentic client
  # Interactive: docker compose run --rm --service-ports agent
  agent:
    build: ./agent
    profiles: ["agent"]
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      MCP_URL: http://mcp-server:3000/mcp
      OAUTH_CLIENT_ID: mcp-agent
      OAUTH_REDIRECT_URI: http://localhost:8765/callback
      CALLBACK_PORT: "8765"
      # Front-channel URLs found in metadata -> back-channel URLs reachable from this container
      BACKCHANNEL_REWRITE: http://localhost:8080=http://idp:8080
      # LLM: "anthropic" (Claude, needs ANTHROPIC_API_KEY) or "openai" (any OpenAI-compatible server,
      # e.g. Ollama / LM Studio running natively on the host, where it can use the GPU)
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
    ports:
      - "8765:8765"   # OAuth redirect_uri lands here from your browser
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop has it already; needed on Linux
    depends_on:
      mcp-server:
        condition: service_healthy
