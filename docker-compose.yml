name: mcp-stepup-lab

services:
  # ---------------------------------------------------------------- IdP / AS
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browser-facing URL. Tokens carry iss=http://localhost:8080/realms/mcp ...
      KC_HOSTNAME: http://localhost:8080
      # ... while containers can still call token/JWKS endpoints via http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Preview feature: `payment-op:<operation-id>` scopes bind a step-up to ONE operation
      KC_FEATURES: parameterized-scopes
    volumes:
      - ./idp/realm-mcp.json:/opt/keycloak/data/import/realm-mcp.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  # ---------------------------------------------------------------- Resource server
  mcp-server:
    build: ./mcp-server
    environment:
      MCP_RESOURCE: http://mcp-server:3000/mcp
      OIDC_ISSUER: http://localhost:8080/realms/mcp
      OIDC_JWKS_URI: http://keycloak:8080/realms/mcp/protocol/openid-connect/certs
      BASE_SCOPE: mcp:basic
      OPERATION_SCOPE_PREFIX: "payment-op:"
      ELICITATION_TIMEOUT_MS: "120000"
      DEMO_UNSAFE_TOOL: "true"
      RISK_AMOUNT_THRESHOLD: "500"
    ports:
      - "3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Agentic client
  # Interactive: docker compose run --rm --service-ports agent
  agent:
    build: ./agent
    profiles: ["agent"]
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      MCP_URL: http://mcp-server:3000/mcp
      OAUTH_CLIENT_ID: mcp-agent
      OAUTH_REDIRECT_URI: http://localhost:8765/callback
      CALLBACK_PORT: "8765"
      # Front-channel URLs found in metadata -> back-channel URLs reachable from this container
      BACKCHANNEL_REWRITE: http://localhost:8080=http://keycloak:8080
    ports:
      - "8765:8765"   # OAuth redirect_uri lands here from your browser
    depends_on:
      mcp-server:
        condition: service_healthy
